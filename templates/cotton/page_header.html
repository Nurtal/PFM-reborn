<c-vars title subtitle="" />
<div class="mb-6 flex flex-wrap items-end justify-between gap-4">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400">{{ subtitle }}</p>{% endif %}
  </div>
  {% if slot %}<div class="flex items-center gap-2">{{ slot }}</div>{% endif %}
</div>
