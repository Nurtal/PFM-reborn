<c-vars icon="layout-grid" title text="" />
<div class="card flex flex-col items-center py-12 text-center">
  <span class="mb-4 grid size-12 place-items-center rounded-full bg-zinc-100 text-zinc-500 dark:bg-zinc-800">
    <c-icon :name="icon" class="size-6" />
  </span>
  <h2 class="font-semibold">{{ title }}</h2>
  {% if text %}<p class="mt-1 max-w-sm text-sm text-zinc-500 dark:text-zinc-400">{{ text }}</p>{% endif %}
  {% if slot %}<div class="mt-4">{{ slot }}</div>{% endif %}
</div>
