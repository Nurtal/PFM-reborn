name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run djlint templates apps --lint
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --locked
      - run: uv run pytest
      - name: Deployment checks (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          PFM_URL: https://pfm.example.org
          PFM_DATA_DIR: /tmp/pfm-check
        run: uv run python manage.py check --deploy --fail-level WARNING

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv export --locked --no-dev --no-hashes --format requirements-txt > requirements.txt
      - run: uvx pip-audit --strict -r requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: pfm-ng:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (blocks on high/critical)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pfm-ng:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Resource budget (README §8)
        run: scripts/resource-budget.sh pfm-ng:ci
