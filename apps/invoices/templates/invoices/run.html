{% extends "layouts/app.html" %}
{% load i18n %}
{% block title %}{% translate "Bill a period" %}{% endblock title %}
{% block content %}
  <c-page-header title="{% translate 'Bill a period' %}" subtitle="{% translate 'Creates a draft per client from confirmed bookings not billed yet. Nothing is numbered until you issue it.' %}" />
  <form method="post" class="card max-w-xl space-y-4" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="grid gap-4 sm:grid-cols-2">
      <c-field :field="form.period_start" />
      <c-field :field="form.period_end" />
    </div>
    <c-field :field="form.client" />
    <div class="flex gap-2">
      <button type="submit" class="btn-primary">{% translate "Create drafts" %}</button>
      <a href="{% url 'invoices:list' current_space.slug %}" class="btn-secondary">{% translate "Cancel" %}</a>
    </div>
  </form>
{% endblock content %}
